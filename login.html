<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nike Shoes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo principal</a>

    <!-- Cabeçalho -->
    <header>
        <nav id="nav" aria-label="Principal">
            <p id="tituloprincipal">Nike Shoes</p>
            <div class="acoes">
                <button type="button" id="mudartema" aria-pressed="false">Mudar tema</button>
                <a href="index.html" class="btn" id="login">Voltar</a>
            </div>
        </nav>
    </header>

    <!-- Formulário de Login Fictício -->
    <main id="conteudo" class="login-container">
        <form class="login-box" action="index.html">
            <h1>Entrar na Conta</h1>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" id="btn-entrar">Entrar</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
